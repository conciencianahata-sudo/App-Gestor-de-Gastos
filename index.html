<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Finanzas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f9f9f8;color:#1a1a1a;font-size:14px;}
    input,select,button{font-family:inherit;font-size:14px;}
    input[type="number"]::-webkit-inner-spin-button{opacity:1;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;

const C={bg:"#f9f9f8",surface:"#ffffff",border:"#e8e6e1",text:"#1a1a1a",muted:"#9a9790",green:"#2d6a4f",red:"#b5392b",blue:"#2c5f8a",accent:"#1a1a1a"};
const ICONS=["💰","🏠","🚗","🍔","💊","📚","✈️","🎮","👗","💡","📱","🏋️","🎵","🐾","💼","📈","🏦","💳","🎁","🛒","⚡","🌊","🔧","🍷","☕","🎓","🏥","💎","🌱","🎯"];
const COLORS=["#2d6a4f","#2c5f8a","#6b4c9a","#b5392b","#c47c1a","#2a7a7a","#5a6e32","#8a3a6b","#3a5a8a","#7a4a2a"];
const MONTH_NAMES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().split("T")[0];

const st={
  card:{background:"#fff",border:"1px solid #e8e6e1",borderRadius:8,padding:20},
  label:{fontSize:11,color:"#9a9790",letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:4,display:"block"},
  input:{width:"100%",border:"1px solid #e8e6e1",borderRadius:6,padding:"8px 10px",fontSize:13,background:"#fff",color:"#1a1a1a",outline:"none",boxSizing:"border-box"},
  select:{width:"100%",border:"1px solid #e8e6e1",borderRadius:6,padding:"8px 10px",fontSize:13,background:"#fff",color:"#1a1a1a",outline:"none",boxSizing:"border-box"},
  btn:{border:"1px solid #e8e6e1",borderRadius:6,padding:"7px 14px",fontSize:13,background:"none",color:"#1a1a1a",cursor:"pointer"},
  btnPri:{border:"none",borderRadius:6,padding:"8px 18px",fontSize:13,background:"#1a1a1a",color:"#fff",cursor:"pointer",fontWeight:500},
  dot:(col)=>({width:8,height:8,borderRadius:"50%",background:col,flexShrink:0}),
};

const INIT={
  currencies:[
    {id:"BOB",code:"BOB",name:"Boliviano",symbol:"Bs.",type:"fiat",rateToUSD:0.1449,color:"#2d6a4f",icon:"🇧🇴"},
    {id:"USD",code:"USD",name:"Dólar",symbol:"$",type:"fiat",rateToUSD:1,color:"#2c5f8a",icon:"🇺🇸"},
    {id:"USDT",code:"USDT",name:"Tether",symbol:"₮",type:"crypto",rateToUSD:1,color:"#2a7a7a",icon:"₮"},
    {id:"BTC",code:"BTC",name:"Bitcoin",symbol:"₿",type:"crypto",rateToUSD:107000,color:"#c47c1a",icon:"₿"},
  ],
  displayCurrency:"BOB",
  accounts:[
    {id:"a1",name:"Efectivo",color:"#2d6a4f",icon:"💵",currencyId:"BOB",excludeBalance:false,archived:false},
    {id:"a2",name:"Banco",color:"#2c5f8a",icon:"🏦",currencyId:"BOB",excludeBalance:false,archived:false},
    {id:"a3",name:"Inversiones BTC",color:"#c47c1a",icon:"₿",currencyId:"BTC",excludeBalance:true,archived:false},
  ],
  categories:[
    {id:"c1",name:"Ingresos",type:"income",color:"#2d6a4f",icon:"💰",archived:false},
    {id:"c2",name:"Hogar",type:"expense",color:"#2c5f8a",icon:"🏠",archived:false},
    {id:"c3",name:"Personal",type:"expense",color:"#6b4c9a",icon:"👗",archived:false},
    {id:"c4",name:"Inversiones",type:"income",color:"#c47c1a",icon:"📈",archived:false},
  ],
  subcategories:[
    {id:"s1",catId:"c1",name:"Salario",icon:"💼",color:null,archived:false},
    {id:"s2",catId:"c1",name:"Freelance",icon:"💻",color:null,archived:false},
    {id:"s3",catId:"c2",name:"Renta",icon:"🏠",color:null,archived:false},
    {id:"s4",catId:"c2",name:"Servicios",icon:"⚡",color:null,archived:false},
    {id:"s5",catId:"c3",name:"Alimentación",icon:"🍔",color:null,archived:false},
    {id:"s6",catId:"c3",name:"Salud",icon:"💊",color:null,archived:false},
    {id:"s7",catId:"c4",name:"Dividendos",icon:"📊",color:null,archived:false},
    {id:"s8",catId:"c4",name:"Rendimientos",icon:"📈",color:null,archived:false},
  ],
  transactions:[
    {id:"t1",date:"2026-05-01",type:"income",accountId:"a1",categoryId:"c1",subcategoryId:"s1",amount:5000,note:"Salario mayo"},
    {id:"t2",date:"2026-05-05",type:"expense",accountId:"a1",categoryId:"c2",subcategoryId:"s3",amount:1500,note:"Renta"},
    {id:"t3",date:"2026-05-10",type:"expense",accountId:"a1",categoryId:"c3",subcategoryId:"s5",amount:350,note:"Supermercado"},
    {id:"t4",date:"2026-05-15",type:"income",accountId:"a3",categoryId:"c4",subcategoryId:"s7",amount:0.001,note:"Dividendos BTC"},
    {id:"t5",date:"2026-04-01",type:"income",accountId:"a1",categoryId:"c1",subcategoryId:"s1",amount:5000,note:"Salario abril"},
    {id:"t6",date:"2026-04-05",type:"expense",accountId:"a1",categoryId:"c2",subcategoryId:"s3",amount:1500,note:"Renta"},
    {id:"t7",date:"2026-03-01",type:"income",accountId:"a1",categoryId:"c1",subcategoryId:"s1",amount:5000,note:"Salario marzo"},
    {id:"t8",date:"2026-03-15",type:"expense",accountId:"a1",categoryId:"c3",subcategoryId:"s6",amount:200,note:"Médico"},
  ],
  budgets:[
    {id:"b1",categoryId:"c2",period:"monthly",amount:2000,currencyId:"BOB"},
    {id:"b2",categoryId:"c3",period:"monthly",amount:500,currencyId:"BOB"},
  ],
  transfers:[],
};

function cvt(amount,fromId,toId,currencies){
  if(fromId===toId)return amount;
  const from=currencies.find(c=>c.id===fromId);
  const to=currencies.find(c=>c.id===toId);
  if(!from||!to)return amount;
  return(amount*from.rateToUSD)/to.rateToUSD;
}
function fmt(amount,curId,currencies){
  const cur=currencies.find(c=>c.id===curId)||{symbol:"$",type:"fiat"};
  const dec=cur.type==="crypto"?(Math.abs(amount)<0.01?8:4):2;
  return cur.symbol+Math.abs(amount).toLocaleString("es-MX",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}

function App(){
  const [S,setS]=useState(INIT);
  const [loaded,setLoaded]=useState(false);
  const [tab,setTab]=useState("registro");
  const [modal,setModal]=useState(null);
  const [menu,setMenu]=useState(false);

  useEffect(()=>{
    if(loaded)return;
    try{const v=localStorage.getItem("fin7");if(v)setS(JSON.parse(v));}catch(e){}
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(!loaded)return;
    try{localStorage.setItem("fin7",JSON.stringify(S));}catch(e){}
  },[S,loaded]);

  const upd=cb=>setS(p=>{const n=JSON.parse(JSON.stringify(p));cb(n);return n;});
  const dc=S.currencies.find(c=>c.id===S.displayCurrency)||S.currencies[0];

  const accBal=id=>{
    const i=S.transactions.filter(t=>t.accountId===id&&t.type==="income").reduce((s,t)=>s+t.amount,0);
    const e=S.transactions.filter(t=>t.accountId===id&&t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const ti=(S.transfers||[]).filter(t=>t.toId===id).reduce((s,t)=>s+t.amount,0);
    const to=(S.transfers||[]).filter(t=>t.fromId===id).reduce((s,t)=>s+t.amount,0);
    return i-e+ti-to;
  };
  const accBalIn=(id,curId)=>{const a=S.accounts.find(x=>x.id===id);return a?cvt(accBal(id),a.currencyId,curId,S.currencies):0;};
  const totalBal=curId=>S.accounts.filter(a=>!a.excludeBalance&&!a.archived).reduce((s,a)=>s+accBalIn(a.id,curId),0);
  const shared={S,upd,setModal,dc,accBal,accBalIn,totalBal};

  const MENU=[
    {id:"cuentas",label:"Cuentas",icon:"🏦"},
    {id:"reportes",label:"Gráficos",icon:"📈"},
    {id:"categorias",label:"Categorías",icon:"🏷️"},
    {id:"presupuesto",label:"Presupuestos",icon:"🎯"},
    {id:"ajustes",label:"Ajustes",icon:"⚙️"},
  ];
  const TABS=[
    {id:"registro",label:"Registro"},
    {id:"panel",label:"Panel"},
    {id:"inversiones",label:"Inversiones"},
    {id:"divisas",label:"Divisas"},
    {id:"importar",label:"Importar"},
  ];

  if(!loaded)return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>Cargando…</div>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text}}>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #e8e6e1",padding:"0 20px",display:"flex",alignItems:"center",gap:14,height:50,position:"sticky",top:0,zIndex:200}}>
        <button onClick={()=>setMenu(o=>!o)} style={{border:"none",background:"none",cursor:"pointer",padding:"6px 4px",display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
          <span style={{display:"block",width:18,height:1.5,background:"#1a1a1a",borderRadius:2}}/>
          <span style={{display:"block",width:18,height:1.5,background:"#1a1a1a",borderRadius:2}}/>
          <span style={{display:"block",width:18,height:1.5,background:"#1a1a1a",borderRadius:2}}/>
        </button>
        <span style={{fontWeight:600,fontSize:15}}>Finanzas</span>
        <div style={{flex:1}}/>
        <span style={{fontSize:12,color:C.muted}}>Ver en</span>
        <select value={S.displayCurrency} onChange={e=>upd(s=>{s.displayCurrency=e.target.value;})}
          style={{border:"1px solid #e8e6e1",borderRadius:5,padding:"4px 8px",fontSize:13,background:"#fff",cursor:"pointer"}}>
          {S.currencies.map(c=><option key={c.id} value={c.id}>{c.icon} {c.code}</option>)}
        </select>
      </div>

      {/* Slide-out menu */}
      {menu&&(
        <div onClick={()=>setMenu(false)} style={{position:"fixed",inset:0,zIndex:150,background:"rgba(0,0,0,0.18)"}}>
          <div onClick={e=>e.stopPropagation()} style={{position:"absolute",top:50,left:0,width:220,background:"#fff",borderRight:"1px solid #e8e6e1",borderBottom:"1px solid #e8e6e1",borderRadius:"0 0 10px 0",boxShadow:"4px 4px 20px rgba(0,0,0,0.08)",padding:"8px 0"}}>
            {MENU.map(item=>(
              <button key={item.id} onClick={()=>{setTab(item.id);setMenu(false);}}
                style={{display:"flex",alignItems:"center",gap:12,width:"100%",border:"none",background:tab===item.id?"#f4f4f2":"none",padding:"11px 20px",fontSize:14,cursor:"pointer",color:tab===item.id?C.text:C.muted,fontWeight:tab===item.id?500:400,textAlign:"left"}}>
                <span style={{fontSize:16}}>{item.icon}</span>{item.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Tabs */}
      <div style={{background:"#fff",borderBottom:"1px solid #e8e6e1",display:"flex",overflowX:"auto",padding:"0 24px"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{border:"none",background:"none",padding:"12px 16px",fontSize:13,cursor:"pointer",whiteSpace:"nowrap",
              color:tab===t.id?C.text:C.muted,fontWeight:tab===t.id?500:400,
              borderBottom:tab===t.id?"2px solid #1a1a1a":"2px solid transparent"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{maxWidth:860,margin:"0 auto",padding:"24px 20px"}}>
        {tab==="registro"    && <Registro {...shared}/>}
        {tab==="panel"       && <Panel {...shared}/>}
        {tab==="inversiones" && <Inversiones {...shared}/>}
        {tab==="divisas"     && <Divisas {...shared}/>}
        {tab==="importar"    && <Importar {...shared}/>}
        {tab==="cuentas"     && <Cuentas {...shared}/>}
        {tab==="reportes"    && <Reportes {...shared}/>}
        {tab==="categorias"  && <Categorias {...shared}/>}
        {tab==="presupuesto" && <Presupuesto {...shared}/>}
        {tab==="ajustes"     && <Ajustes {...shared}/>}
      </div>

      {modal&&<ModalWrap modal={modal} setModal={setModal} S={S} upd={upd}/>}
    </div>
  );
}

// ─── REGISTRO ────────────────────────────────────────────────────────────────
function Registro({S,upd}){
  const [sub,setSub]=useState("expense");
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState({accountId:"",itemId:"",date:today(),note:"",amount:""});
  const ff=k=>v=>setForm(p=>({...p,[k]:v}));
  const switchSub=t=>{setSub(t);setOpen(false);setForm({accountId:"",itemId:"",date:today(),note:"",amount:""});};
  const accs=S.accounts.filter(a=>!a.archived);
  const cats=S.categories.filter(c=>!c.archived&&c.type===sub);
  const subs=(S.subcategories||[]).filter(s=>{
    if(s.archived)return false;
    const c=S.categories.find(x=>x.id===s.catId);
    return c&&!c.archived&&c.type===sub;
  });
  const allItems=[
    ...cats.map(c=>({id:c.id,name:c.name,icon:c.icon,color:c.color,isCat:true})),
    ...subs.map(s=>{const c=S.categories.find(x=>x.id===s.catId);return{id:s.id,name:s.name,icon:s.icon,color:s.color||c?.color||C.muted,isCat:false,catId:s.catId};}),
  ];
  const ready=form.accountId&&form.itemId&&form.date&&form.amount&&parseFloat(form.amount)>0;
  const add=()=>{
    if(!ready)return;
    const item=allItems.find(i=>i.id===form.itemId);
    upd(s=>{s.transactions.push({id:uid(),date:form.date,type:sub,accountId:form.accountId,categoryId:item?.isCat?form.itemId:(item?.catId||""),subcategoryId:item?.isCat?"":form.itemId,amount:parseFloat(form.amount),note:form.note});});
    setForm({accountId:form.accountId,itemId:"",date:today(),note:"",amount:""});
    setOpen(false);
  };
  const recent=[...S.transactions].filter(t=>t.type===sub).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"flex",background:"#fff",border:"1px solid #e8e6e1",borderRadius:8,overflow:"hidden"}}>
        {[["expense","Gastos"],["income","Ingresos"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>switchSub(id)} style={{flex:1,border:"none",padding:"12px",fontSize:14,cursor:"pointer",fontWeight:sub===id?500:400,background:sub===id?(id==="expense"?"#fdf2f2":"#f2faf5"):"none",color:sub===id?(id==="expense"?C.red:C.green):C.muted}}>{lbl}</button>
        ))}
      </div>
      {!open&&<button onClick={()=>setOpen(true)} style={{alignSelf:"flex-end",width:40,height:40,borderRadius:"50%",border:"none",background:"#1a1a1a",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>}
      {open&&(
        <div style={{...st.card,display:"flex",flexDirection:"column",gap:14,borderLeft:`3px solid ${sub==="expense"?C.red:C.green}`}}>
          <div>
            <label style={st.label}>Monto</label>
            <input autoFocus type="number" value={form.amount} onChange={e=>ff("amount")(e.target.value)} placeholder="0.00" step="any" style={{...st.input,fontSize:22,fontWeight:300,border:"none",borderBottom:"1px solid #e8e6e1",borderRadius:0,padding:"4px 0"}}/>
          </div>
          <div>
            <label style={st.label}>Cuenta</label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {accs.map(a=>{const cur=S.currencies.find(c=>c.id===a.currencyId);const sel=form.accountId===a.id;return(
                <button key={a.id} onClick={()=>ff("accountId")(a.id)} style={{border:`1px solid ${sel?a.color:"#e8e6e1"}`,borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer",background:sel?a.color+"18":"none",color:sel?a.color:C.muted,fontWeight:sel?500:400,display:"flex",alignItems:"center",gap:5}}>
                  <span style={{width:6,height:6,borderRadius:"50%",background:a.color,display:"inline-block"}}/>{a.name} ({cur?.code})
                </button>
              );})}
            </div>
          </div>
          <div>
            <label style={st.label}>Categoría</label>
            {allItems.length===0?<div style={{fontSize:12,color:C.muted}}>No hay categorías. Agrégalas en Categorías.</div>:
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {allItems.map(item=>{const sel=form.itemId===item.id;return(
                  <button key={item.id} onClick={()=>ff("itemId")(item.id)} style={{border:`1px solid ${sel?item.color:"#e8e6e1"}`,borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer",background:sel?item.color+"18":"none",color:sel?item.color:C.muted,fontWeight:sel?500:400,display:"flex",alignItems:"center",gap:5}}>
                    {item.icon} {item.name}
                  </button>
                );})}
              </div>
            }
          </div>
          <div>
            <label style={st.label}>Fecha</label>
            <input type="date" value={form.date} onChange={e=>ff("date")(e.target.value)} style={{...st.input,width:160}}/>
          </div>
          <div>
            <label style={st.label}>Detalle <span style={{textTransform:"none",letterSpacing:0,fontSize:10}}>(opcional)</span></label>
            <input value={form.note} onChange={e=>ff("note")(e.target.value)} placeholder="Descripción…" style={st.input}/>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>{setOpen(false);setForm({accountId:"",itemId:"",date:today(),note:"",amount:""}); }} style={st.btn}>Cancelar</button>
            <button onClick={add} disabled={!ready} style={{...st.btnPri,opacity:ready?1:0.4,background:sub==="expense"?C.red:C.green}}>Añadir {sub==="expense"?"gasto":"ingreso"}</button>
          </div>
        </div>
      )}
      {recent.length>0&&(
        <div style={st.card}>
          <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:14}}>Últimos {sub==="expense"?"gastos":"ingresos"}</div>
          {recent.map(t=>{
            const s2=S.subcategories?.find(x=>x.id===t.subcategoryId);
            const cat=S.categories.find(x=>x.id===t.categoryId);
            const acc=S.accounts.find(x=>x.id===t.accountId);
            const cur=acc?S.currencies.find(x=>x.id===acc.currencyId):null;
            return(
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid #e8e6e1"}}>
                <span style={{fontSize:16}}>{s2?.icon||cat?.icon||"·"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13}}>{t.note||s2?.name||cat?.name||"—"}</div>
                  <div style={{fontSize:11,color:C.muted}}>{t.date} · {acc?.name}</div>
                </div>
                <div style={{fontWeight:500,fontSize:13,color:t.type==="income"?C.green:C.red}}>{t.type==="income"?"+":"-"}{fmt(t.amount,cur?.id||"BOB",S.currencies)}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── PANEL ───────────────────────────────────────────────────────────────────
function Panel({S,dc,accBal,accBalIn,totalBal}){
  const now=new Date();
  const m=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const dcId=dc.id;
  const isExcl=t=>S.accounts.find(a=>a.id===t.accountId)?.excludeBalance;
  const cv=t=>{const a=S.accounts.find(x=>x.id===t.accountId);return a?cvt(t.amount,a.currencyId,dcId,S.currencies):t.amount;};
  const mInc=S.transactions.filter(t=>t.date.startsWith(m)&&t.type==="income"&&!isExcl(t)).reduce((s,t)=>s+cv(t),0);
  const mExp=S.transactions.filter(t=>t.date.startsWith(m)&&t.type==="expense"&&!isExcl(t)).reduce((s,t)=>s+cv(t),0);
  const tot=totalBal(dcId);
  const recent=[...S.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{...st.card,padding:24}}>
        <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Balance total · {dc.code}</div>
        <div style={{fontSize:34,fontWeight:300,color:tot>=0?C.green:C.red,marginBottom:20}}>{fmt(tot,dcId,S.currencies)}</div>
        <div style={{display:"flex",gap:28,flexWrap:"wrap"}}>
          {[{l:"Ingresos mes",v:mInc,c:C.green},{l:"Egresos mes",v:mExp,c:C.red},{l:"Neto",v:mInc-mExp,c:(mInc-mExp)>=0?C.green:C.red}].map(k=>(

            const cat=S.categories.find(c=>c.id===t.categoryId);
            const s2=S.subcategories?.find(x=>x.id===t.subcategoryId);

// ─── ICON/COLOR PICKER ───────────────────────────────────────────────────────

  return(
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{setSi(v=>!v);setSc(false);}} style={{border:`1px solid ${si?"#1a1a1a":"#e8e6e1"}`,borderRadius:6,padding:"4px 10px",fontSize:14,cursor:"pointer",background:"none",display:"flex",alignItems:"center",gap:5,color:C.muted}}>{icon} <span style={{fontSize:11}}>Ícono</span></button>
        <button onClick={()=>{setSc(v=>!v);setSi(false);}} style={{border:`1px solid ${sc?"#1a1a1a":"#e8e6e1"}`,borderRadius:6,padding:"4px 10px",cursor:"pointer",background:"none",display:"flex",alignItems:"center",gap:6,color:C.muted}}><span style={{width:14,height:14,borderRadius:"50%",background:color,display:"inline-block"}}/><span style={{fontSize:11}}>Color</span></button>
      </div>
      {si&&<div style={{display:"flex",flexWrap:"wrap",gap:4,padding:8,background:"#fff",border:"1px solid #e8e6e1",borderRadius:6}}>{ICONS.map(ic=><button key={ic} onClick={()=>{onIcon(ic);setSi(false);}} style={{width:28,height:28,border:icon===ic?"2px solid #1a1a1a":"1px solid #e8e6e1",borderRadius:5,background:"none",cursor:"pointer",fontSize:14}}>{ic}</button>)}</div>}
      {sc&&<div style={{display:"flex",flexWrap:"wrap",gap:5,padding:8,background:"#fff",border:"1px solid #e8e6e1",borderRadius:6}}>
        <button onClick={()=>{onAuto();setSc(false);}} style={{width:24,height:24,borderRadius:"50%",background:(catColor||C.muted)+"55",border:isAuto?"3px solid #1a1a1a":"2px solid transparent",cursor:"pointer",fontSize:8}}>auto</button>
        {COLORS.map(c=><button key={c} onClick={()=>{onColor(c);setSc(false);}} style={{width:24,height:24,borderRadius:"50%",background:c,border:(!isAuto&&color===c)?"3px solid #1a1a1a":"2px solid transparent",cursor:"pointer"}}/>)}
      </div>}
    </div>
  );
}

// ─── CATEGORIAS ──────────────────────────────────────────────────────────────
function Categorias({S,upd,setModal}){
  const [exp,setExp]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(null);
  const blank={name:"",icon:"🏷️",color:null};
  const [ni,setNi]=useState(blank);
  const [ei,setEi]=useState(null);
  const toggle=id=>setExp(e=>e===id?null:id);
  const saveNew=catId=>{if(!ni.name)return;upd(s=>{s.subcategories.push({...ni,id:uid(),catId,archived:false});});setNi(blank);setExp(null);};
  const saveEdit=()=>{if(!ei)return;upd(s=>{const x=s.subcategories.find(i=>i.id===ei.id);if(x)Object.assign(x,{name:ei.name,icon:ei.icon,color:ei.color});});setEi(null);};
  const handleDelete=catId=>{upd(s=>{s.categories=s.categories.filter(x=>x.id!==catId);s.subcategories=s.subcategories.filter(x=>x.catId!==catId);});setConfirmDelete(null);};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",justifyContent:"flex-end"}}><button onClick={()=>setModal({type:"newCategory"})} style={st.btnPri}>+ Categoría</button></div>
      {S.categories.filter(c=>!c.archived).map(cat=>(
        <div key={cat.id} style={{...st.card,borderLeft:`3px solid ${cat.color}`,padding:0,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px"}}>
            <span style={{width:30,height:30,borderRadius:"50%",background:cat.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{cat.icon}</span>
            <div style={{flex:1}}><span style={{fontWeight:500}}>{cat.name}</span><span style={{marginLeft:10,fontSize:11,color:cat.type==="income"?C.green:C.red}}>{cat.type==="income"?"Ingreso":"Egreso"}</span></div>
            <span style={{fontSize:11,color:C.muted}}>{S.subcategories?.filter(s=>s.catId===cat.id&&!s.archived).length||0} ítems</span>
            <button onClick={()=>setModal({type:"editCategory",category:cat})} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.muted}}>✏︎</button>
            <button onClick={()=>upd(s=>{const c=s.categories.find(x=>x.id===cat.id);if(c)c.archived=true;})} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.muted}}>📁</button>
            {confirmDelete===cat.id?(
              <div style={{display:"flex",alignItems:"center",gap:6,background:"#fdf2f2",border:"1px solid #f0c4be",borderRadius:6,padding:"3px 8px"}}>
                <span style={{fontSize:11,color:C.red}}>¿Eliminar?</span>
                <button onClick={()=>handleDelete(cat.id)} style={{border:"none",background:C.red,color:"#fff",borderRadius:4,padding:"2px 8px",fontSize:11,cursor:"pointer",fontWeight:500}}>Sí</button>
                <button onClick={()=>setConfirmDelete(null)} style={{border:"1px solid #e8e6e1",background:"none",borderRadius:4,padding:"2px 8px",fontSize:11,cursor:"pointer"}}>No</button>
              </div>
            ):(
              <button onClick={()=>setConfirmDelete(cat.id)} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.red}}>🗑</button>
            )}
            <button onClick={()=>toggle(cat.id)} style={{border:"1px solid #e8e6e1",background:"none",borderRadius:5,cursor:"pointer",fontSize:12,padding:"3px 8px",color:C.muted}}>{exp===cat.id?"▲":"▼"}</button>
          </div>
          {exp===cat.id&&(
            <div style={{borderTop:"1px solid #e8e6e1",background:C.bg}}>
              {S.subcategories?.filter(s=>s.catId===cat.id&&!s.archived).map(sub=>(
                <div key={sub.id}>
                  {ei?.id===sub.id?(
                    <div style={{padding:"10px 16px",display:"flex",flexDirection:"column",gap:8,background:"#fff",borderBottom:"1px solid #e8e6e1"}}>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        <input value={ei.name} onChange={e=>setEi(p=>({...p,name:e.target.value}))} style={{...st.input,flex:1,fontSize:13}} autoFocus/>
                        <button onClick={saveEdit} style={{...st.btnPri,padding:"6px 12px",fontSize:12}}>✓</button>
                        <button onClick={()=>setEi(null)} style={{...st.btn,padding:"6px 10px",fontSize:12}}>✕</button>
                      </div>
                      <IcoPicker icon={ei.icon} color={ei.color||cat.color} catColor={cat.color} onIcon={ic=>setEi(p=>({...p,icon:ic}))} onColor={c=>setEi(p=>({...p,color:c}))} onAuto={()=>setEi(p=>({...p,color:null}))} isAuto={ei.color===null}/>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"9px 16px",borderBottom:"1px solid #e8e6e1"}}>
                      <span style={{width:26,height:26,borderRadius:"50%",background:(sub.color||cat.color)+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{sub.icon}</span>
                      <span style={{flex:1,fontSize:13}}>{sub.name}</span>
                      <button onClick={()=>setEi({id:sub.id,name:sub.name,icon:sub.icon,color:sub.color})} style={{border:"none",background:"none",cursor:"pointer",fontSize:12,color:C.muted}}>✏︎</button>
                      <button onClick={()=>upd(s=>{const x=s.subcategories.find(i=>i.id===sub.id);if(x)x.archived=true;})} style={{border:"none",background:"none",cursor:"pointer",fontSize:12,color:C.muted}}>✕</button>
                    </div>
                  )}
                </div>
              ))}
              <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:8}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input value={ni.name} onChange={e=>setNi(p=>({...p,name:e.target.value}))} placeholder="Nuevo ítem…" style={{...st.input,flex:1,fontSize:13}}/>
                  <button onClick={()=>saveNew(cat.id)} disabled={!ni.name} style={{...st.btnPri,padding:"6px 12px",fontSize:12,opacity:ni.name?1:0.4}}>+ Añadir</button>
                </div>
                <IcoPicker icon={ni.icon} color={ni.color||cat.color} catColor={cat.color} onIcon={ic=>setNi(p=>({...p,icon:ic}))} onColor={c=>setNi(p=>({...p,color:c}))} onAuto={()=>setNi(p=>({...p,color:null}))} isAuto={ni.color===null}/>
              </div>
            </div>
          )}
        </div>
      ))}
      {S.categories.some(c=>c.archived)&&(
        <details style={{fontSize:12,color:C.muted}}>
          <summary style={{cursor:"pointer",marginBottom:8}}>Archivadas</summary>
          {S.categories.filter(c=>c.archived).map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #e8e6e1"}}>
              <div style={st.dot(c.color)}/><span style={{flex:1}}>{c.name}</span>
              <button onClick={()=>upd(s=>{const x=s.categories.find(i=>i.id===c.id);if(x)x.archived=false;})} style={{...st.btn,fontSize:12}}>Restaurar</button>
            </div>
          ))}
        </details>
      )}
    </div>
  );
}

// ─── PRESUPUESTO ─────────────────────────────────────────────────────────────
function Presupuesto({S,upd,setModal,dc}){
  const now=new Date();
  const [selMonth,setSelMonth]=useState(String(now.getMonth()+1).padStart(2,"0"));
  const [selYear,setSelYear]=useState(now.getFullYear().toString());
  const years=[...new Set([now.getFullYear().toString(),...S.transactions.map(t=>t.date.slice(0,4))])].sort().reverse();
  const monthKey=`${selYear}-${selMonth}`;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:6}}>
          <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={{...st.select,width:120}}>
            {MONTH_NAMES.map((n,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{n}</option>)}
          </select>
          <select value={selYear} onChange={e=>setSelYear(e.target.value)} style={{...st.select,width:90}}>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        <button onClick={()=>setModal({type:"newBudget"})} style={st.btnPri}>+ Presupuesto</button>
      </div>
      {S.budgets.length===0&&<div style={{...st.card,textAlign:"center",padding:32,color:C.muted,fontSize:13}}>Sin presupuestos creados aún.</div>}
      {S.budgets.map(b=>{
        const cat=S.categories.find(c=>c.id===b.categoryId);
        if(!cat)return null;
        const bcId=b.currencyId||dc.id;
        const cur=S.currencies.find(c=>c.id===bcId);
        const spent=S.transactions.filter(t=>t.categoryId===b.categoryId&&t.type==="expense"&&(b.period==="monthly"?t.date.startsWith(monthKey):t.date.startsWith(selYear))).reduce((s,t)=>{
          const a=S.accounts.find(x=>x.id===t.accountId);return s+(a?cvt(t.amount,a.currencyId,bcId,S.currencies):t.amount);
        },0);
        const remaining=b.amount-spent;
        const pct=Math.min(100,(spent/b.amount)*100),over=spent>b.amount;
        const barColor=over?C.red:pct>=80?"#c47c1a":C.green;
        return(
          <div key={b.id} style={{...st.card,borderLeft:`3px solid ${cat.color}`,padding:"16px 20px"}}>
            <div style={{display:"flex",alignItems:"center",marginBottom:14}}>
              <span style={{width:28,height:28,borderRadius:"50%",background:cat.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,marginRight:10,flexShrink:0}}>{cat.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:500,fontSize:14}}>{cat.name}</div>
                <div style={{fontSize:11,color:C.muted}}>{b.period==="monthly"?`${MONTH_NAMES[parseInt(selMonth)-1]} ${selYear}`:`Año ${selYear}`} · {cur?.code}</div>
              </div>
              <div style={{fontSize:12,fontWeight:600,color:barColor,marginRight:10}}>{pct.toFixed(0)}%</div>
              <button onClick={()=>upd(s=>{s.budgets=s.budgets.filter(x=>x.id!==b.id);})} style={{border:"none",background:"none",cursor:"pointer",fontSize:13,color:C.muted}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <div style={{background:C.bg,borderRadius:6,padding:"10px 14px"}}>
                <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>Presupuestado</div>
                <div style={{fontSize:17,fontWeight:500}}>{fmt(b.amount,bcId,S.currencies)}</div>
              </div>
              <div style={{background:over?"#fdf2f2":C.bg,borderRadius:6,padding:"10px 14px",border:over?`1px solid ${C.red}22`:"none"}}>
                <div style={{fontSize:10,color:over?C.red:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>Gastado</div>
                <div style={{fontSize:17,fontWeight:500,color:over?C.red:C.text}}>{fmt(spent,bcId,S.currencies)}</div>
              </div>
            </div>
            <div style={{height:5,borderRadius:5,background:"#e8e6e1"}}><div style={{height:"100%",borderRadius:5,width:`${pct}%`,background:barColor,transition:"width 0.3s"}}/></div>
            <div style={{marginTop:7,fontSize:11,color:over?C.red:remaining<=0.1*b.amount?"#c47c1a":C.muted}}>
              {over?`⚠ Superado en ${fmt(spent-b.amount,bcId,S.currencies)}`:`Disponible: ${fmt(remaining,bcId,S.currencies)}`}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── REPORTES ────────────────────────────────────────────────────────────────
const MONTHS_FULL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function Reportes({S,dc}){
  const [mode,setMode]=useState("monthly");
  const [y1,setY1]=useState(new Date().getFullYear().toString());
  const [y2,setY2]=useState((new Date().getFullYear()-1).toString());
  const [from,setFrom]=useState("");
  const [to,setTo]=useState("");
  const dcId=dc.id;
  const years=[...new Set(S.transactions.map(t=>t.date.slice(0,4)))].sort().reverse();
  const isExcl=t=>S.accounts.find(a=>a.id===t.accountId)?.excludeBalance;
  const cv=t=>{const a=S.accounts.find(x=>x.id===t.accountId);return a?cvt(t.amount,a.currencyId,dcId,S.currencies):t.amount;};
  const monthly=yr=>Array.from({length:12},(_,i)=>{
    const mk=`${yr}-${String(i+1).padStart(2,"0")}`;
    const txs=S.transactions.filter(t=>t.date.startsWith(mk)&&!isExcl(t));
    const inc=txs.filter(t=>t.type==="income").reduce((s,t)=>s+cv(t),0);
    const exp=txs.filter(t=>t.type==="expense").reduce((s,t)=>s+cv(t),0);
    return{month:["E","F","M","A","M","J","J","A","S","O","N","D"][i],inc,exp,net:inc-exp};
  });
  const catData=(f,t)=>S.categories.filter(c=>!c.archived&&c.type==="expense").map(cat=>{
    let txs=S.transactions.filter(x=>x.categoryId===cat.id&&x.type==="expense");
    if(f)txs=txs.filter(x=>x.date>=f);if(t)txs=txs.filter(x=>x.date<=t);
    return{cat,total:txs.reduce((s,x)=>s+cv(x),0)};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const d1=monthly(y1),d2=monthly(y2);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
        {[["monthly","Mensual"],["compare","Comparar años"],["category","Categorías"],["custom","Período"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setMode(id)} style={{...st.btn,fontWeight:mode===id?500:400,background:mode===id?"#1a1a1a":"none",color:mode===id?"#fff":"#1a1a1a"}}>{lbl}</button>
        ))}
        <span style={{marginLeft:"auto",fontSize:12,color:C.muted}}>en {dc.code}</span>
      </div>
      {mode==="monthly"&&(
        <div style={st.card}>
          <div style={{display:"flex",alignItems:"center",marginBottom:20}}>
            <span style={{fontWeight:500}}>Resumen {y1}</span>
            <select value={y1} onChange={e=>setY1(e.target.value)} style={{...st.select,width:100,marginLeft:"auto"}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
          </div>
          <BarChart data={d1} dcId={dcId} currencies={S.currencies}/>
        </div>
      )}
      {mode==="compare"&&(
        <div style={st.card}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,flexWrap:"wrap"}}>
            <span style={{fontWeight:500}}>Comparar</span>
            <select value={y1} onChange={e=>setY1(e.target.value)} style={{...st.select,width:90}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
            <span style={{color:C.muted}}>vs</span>
            <select value={y2} onChange={e=>setY2(e.target.value)} style={{...st.select,width:90}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
          </div>
          <CompareChart d1={d1} d2={d2} y1={y1} y2={y2} dcId={dcId} currencies={S.currencies}/>
        </div>
      )}
      {mode==="category"&&<CatReport catData={catData} y1={y1} setY1={setY1} years={years} dcId={dcId} S={S}/>}
      {mode==="custom"&&<CustomReport S={S} from={from} setFrom={setFrom} to={to} setTo={setTo} isExcl={isExcl} cv={cv} catData={catData} dcId={dcId}/>}
    </div>
  );
}

function CatReport({catData,y1,setY1,years,dcId,S}){
  const now=new Date();
  const [selMonth,setSelMonth]=useState(String(now.getMonth()+1).padStart(2,"0"));
  const [selCat,setSelCat]=useState(null);
  const monthKey=`${y1}-${selMonth}`;
  const items=catData(`${monthKey}-01`,`${monthKey}-31`);
  const tot=items.reduce((s,x)=>s+x.total,0);
  const txsForCat=catId=>S.transactions.filter(t=>t.categoryId===catId&&t.type==="expense"&&t.date.startsWith(monthKey)).sort((a,b)=>b.date.localeCompare(a.date));

    <div style={st.card}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,flexWrap:"wrap"}}>

            {MONTH_NAMES.map((n,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{n}</option>)}

              <span style={{width:28,height:28,borderRadius:"50%",background:cat.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{cat.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:500}}>{cat.name}</div>

function CustomReport({S,from,setFrom,to,setTo,isExcl,cv,catData,dcId}){
  const txs=from&&to?S.transactions.filter(t=>t.date>=from&&t.date<=to&&!isExcl(t)):[];
  const inc=txs.filter(t=>t.type==="income").reduce((s,t)=>s+cv(t),0);
  const exp=txs.filter(t=>t.type==="expense").reduce((s,t)=>s+cv(t),0);

  const tot=cd.reduce((s,x)=>s+x.total,0);

    <div style={st.card}>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>

        </div>
      </div>
      {sd1&&(
        <div style={{marginBottom:16,padding:"12px 16px",background:C.bg,borderRadius:8,border:"1px solid #e8e6e1"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontWeight:600,fontSize:13}}>{MONTHS_FULL[sel]}</span>
            <span style={{fontSize:11,color:C.muted,cursor:"pointer"}} onClick={()=>setSel(null)}>✕</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr 1fr",gap:"5px 14px",fontSize:12,alignItems:"center"}}>
            <span style={{color:C.muted,fontSize:11}}>Año</span><span style={{color:C.muted,fontSize:11}}>Ingresos</span><span style={{color:C.muted,fontSize:11}}>Egresos</span><span style={{color:C.muted,fontSize:11}}>Neto</span>
            <span style={{fontWeight:600,color:C.blue}}>{y1}</span>
            <span style={{color:C.green,fontWeight:500}}>{fmt(sd1.inc,dcId,currencies)}</span>
            <span style={{color:C.red,fontWeight:500}}>{fmt(sd1.exp,dcId,currencies)}</span>
            <span style={{color:sd1.net>=0?C.blue:C.red,fontWeight:500}}>{sd1.net>=0?"+":""}{fmt(sd1.net,dcId,currencies)}</span>
            <span style={{fontWeight:600,color:"#c47c1a"}}>{y2}</span>
            <span style={{color:C.green,fontWeight:500}}>{fmt(sd2.inc,dcId,currencies)}</span>

            <span style={{color:sd2.net>=0?C.blue:C.red,fontWeight:500}}>{sd2.net>=0?"+":""}{fmt(sd2.net,dcId,currencies)}</span>
            {(()=>{const di=fmtDiff(sd1.inc,sd2.inc),de=fmtDiff(sd1.exp,sd2.exp),dn=fmtDiff(sd1.net,sd2.net);return(<><span style={{color:C.muted,fontSize:11}}>Δ</span><span style={{fontSize:11,color:di?.up?C.green:C.red}}>{di?`${di.up?"+":""}${di.pct}%`:"—"}</span><span style={{fontSize:11,color:de?.up?C.red:C.green}}>{de?`${de.up?"+":""}${de.pct}%`:"—"}</span><span style={{fontSize:11,color:dn?.up?C.blue:C.red}}>{dn?`${dn.up?"+":""}${dn.pct}%`:"—"}</span></>);})()}
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:3,alignItems:"flex-end",height:130}}>
        {d1.map((d,i)=>{
          const v1=d[metric],v2=d2[i][metric];
          const h1=Math.max(v1>0?3:0,((v1-mn)/rng)*110),h2=Math.max(v2>0?3:0,((v2-mn)/rng)*110);
          const isSel=sel===i;
          return(
            <div key={i} onClick={()=>toggle(i)} title={MONTHS_FULL[i]} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"}}>

                <div style={{flex:1,background:C.blue,borderRadius:"2px 2px 0 0",height:`${h1}px`,opacity:isSel?1:0.75}}/>
                <div style={{flex:1,background:"#c47c1a",borderRadius:"2px 2px 0 0",height:`${h2}px`,opacity:isSel?1:0.75}}/>

        );})}

      {sel===null&&<div style={{marginTop:8,fontSize:11,color:C.muted,textAlign:"center"}}>Toca un mes para comparar {y1} vs {y2}</div>}
    </div>
  );
}

function Inversiones({S,dc,accBal,accBalIn}){
  const dcId=dc.id;
  const invAccs=S.accounts.filter(a=>a.excludeBalance&&!a.archived);
  const invTx=S.transactions.filter(t=>invAccs.some(a=>a.id===t.accountId));
  const cv=t=>{const a=S.accounts.find(x=>x.id===t.accountId);return a?cvt(t.amount,a.currencyId,dcId,S.currencies):t.amount;};
  const totInv=invAccs.reduce((s,a)=>s+accBalIn(a.id,dcId),0);
  const totInc=invTx.filter(t=>t.type==="income").reduce((s,t)=>s+cv(t),0);
  const totExp=invTx.filter(t=>t.type==="expense").reduce((s,t)=>s+cv(t),0);
  const netR=totInc-totExp;
  const bySub={};
  invTx.filter(t=>t.type==="income").forEach(t=>{const k=t.subcategoryId||t.categoryId||"x";bySub[k]=(bySub[k]||0)+cv(t);});
  const subE=Object.entries(bySub).map(([k,v])=>{const s=S.subcategories?.find(x=>x.id===k);const c=S.categories.find(x=>x.id===k)||S.categories.find(x=>x.id===s?.catId);return{label:s?.name||c?.name||"Otro",icon:s?.icon||c?.icon||"💰",color:s?.color||c?.color||C.muted,total:v};}).sort((a,b)=>b.total-a.total);
  const maxSub=Math.max(...subE.map(e=>e.total),1);
  const now=new Date();
  const months=Array.from({length:12},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;const lbl=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][d.getMonth()];const inc=invTx.filter(t=>t.date.startsWith(mk)&&t.type==="income").reduce((s,t)=>s+cv(t),0);return{lbl,inc};});
  const maxM=Math.max(...months.map(m=>m.inc),1);
  const recent=[...invTx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  if(invAccs.length===0)return(<div style={{...st.card,textAlign:"center",padding:40,color:C.muted}}><div style={{fontSize:32,marginBottom:12}}>💎</div><div style={{fontSize:14,marginBottom:6}}>Sin cuentas de inversión</div><div style={{fontSize:12}}>Ve a <strong>Cuentas</strong> y activa "No incluir en balance total".</div></div>);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
        {[{l:"Valor en cartera",v:totInv,c:C.blue},{l:"Rendimientos",v:totInc,c:C.green},{l:"Costos",v:totExp,c:C.red},{l:"Retorno neto",v:netR,c:netR>=0?C.green:C.red}].map(k=>(
          <div key={k.l} style={{...st.card,borderTop:`3px solid ${k.c}`}}><div style={{fontSize:11,color:C.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.04em"}}>{k.l}</div><div style={{fontSize:20,fontWeight:300,color:k.c}}>{fmt(k.v,dcId,S.currencies)}</div></div>
        ))}
      </div>
      <div style={st.card}>
        <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:14}}>Cuentas de inversión</div>
        {invAccs.map(a=>{const cur=S.currencies.find(c=>c.id===a.currencyId)||S.currencies[0];const raw=accBal(a.id),cv2=accBalIn(a.id,dcId);const aInc=invTx.filter(t=>t.accountId===a.id&&t.type==="income").reduce((s,t)=>s+t.amount,0);return(

      {recent.length>0&&<div style={st.card}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:14}}>Movimientos recientes</div>{recent.map(t=>{const s2=S.subcategories?.find(x=>x.id===t.subcategoryId);const cat=S.categories.find(c=>c.id===t.categoryId);const acc=S.accounts.find(a=>a.id===t.accountId);const cur=acc?S.currencies.find(c=>c.id===acc.currencyId):null;return(<div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid #e8e6e1"}}><span style={{fontSize:16}}>{s2?.icon||cat?.icon||"💰"}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:13}}>{t.note||s2?.name||cat?.name||"—"}</div><div style={{fontSize:11,color:C.muted}}>{t.date} · {acc?.name}</div></div><div style={{fontWeight:500,fontSize:13,color:t.type==="income"?C.green:C.red}}>{t.type==="income"?"+":"-"}{fmt(t.amount,cur?.id||"BOB",S.currencies)}</div></div>);})}</div>}

  );

function RateEditor({cur,upd}){
  const [edit,setEdit]=useState(false);

  if(edit)return(<div style={{display:"flex",gap:4}}><input autoFocus type="number" value={val} onChange={e=>setVal(e.target.value)} style={{...st.input,width:100,fontSize:13}}/><button onClick={()=>{const n=parseFloat(val);if(n>0)upd(s=>{const c=s.currencies.find(x=>x.id===cur.id);if(c)c.rateToUSD=1/n;});setEdit(false);}} style={{...st.btnPri,padding:"4px 8px"}}>✓</button><button onClick={()=>setEdit(false)} style={{...st.btn,padding:"4px 8px"}}>✕</button></div>);
  return <button onClick={()=>{setVal(disp);setEdit(true);}} style={{...st.btn,fontSize:13,padding:"4px 10px"}}>{disp} {cur.code} ✏︎</button>;
}

// ─── IMPORTAR ────────────────────────────────────────────────────────────────
function parseLine(line){const r=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===','&&!inQ){r.push(cur.trim());cur="";}else cur+=ch;}r.push(cur.trim());return r;}

function Importar({S,upd}){
  const [prev,setPrev]=useState(null);
  const [aMap,setAMap]=useState({});
  const [cMap,setCMap]=useState({});
  const [tMode,setTMode]=useState("auto");
  const [status,setStatus]=useState(null);
  const [err,setErr]=useState("");
  const ref=useRef();
  const CA="Fecha y hora",CB="Categoría",CC="Cuenta",CD="Cantidad en la divisa predeterminada",CE="Cantidad en la divisa de la cuenta",CF="Cantidad de la transacción en la divisa de la transacción",CG="Comentario",CH="Etiquetas";
  const handleFile=async e=>{
    setStatus(null);setErr("");const f=e.target.files[0];if(!f)return;
    try{
      const text=await f.text();const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){setErr("Archivo vacío.");return;}
      const headers=parseLine(lines[0]).map(h=>h.replace(/^\uFEFF/,"").trim());
      const allRows=lines.slice(1).map(l=>{const vs=parseLine(l);return Object.fromEntries(headers.map((h,i)=>[h,(vs[i]||"").trim()]));}).filter(r=>Object.values(r).some(v=>v));
      const accNames=[...new Set(allRows.map(r=>r[CC]).filter(Boolean))];
      const im={};accNames.forEach(n=>{const m=S.accounts.find(a=>a.name.toLowerCase()===n.toLowerCase());im[n]=m?.id||S.accounts[0]?.id||"";});
      const catNames=[...new Set(allRows.map(r=>r[CB]).filter(Boolean))];
      const cm={};catNames.forEach(n=>{const mc=S.categories.find(c=>c.name.toLowerCase()===n.toLowerCase());const ms=S.subcategories?.find(x=>x.name.toLowerCase()===n.toLowerCase());cm[n]=mc?.id||ms?.id||"";});
      setAMap(im);setCMap(cm);setPrev({headers,previewRows:allRows.slice(0,5),allRows});
    }catch(e2){setErr("Error: "+e2.message);}
  };
  const pDate=str=>{if(!str)return today();const a=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(a)return`${a[3]}-${a[2].padStart(2,"0")}-${a[1].padStart(2,"0")}`;const b=str.match(/^(\d{4})-(\d{2})-(\d{2})/);if(b)return`${b[1]}-${b[2]}-${b[3]}`;return today();};
  const pAmt=str=>Math.abs(parseFloat((str||"").replace(/[^0-9.,-]/g,"").replace(",","."))||0);
  const doImport=()=>{
    if(!prev)return;let count=0,skip=0;const txs=[];
    prev.allRows.forEach(r=>{
      const raw=r[CE]||r[CD]||r[CF]||"";const amount=pAmt(raw);if(!amount){skip++;return;}
      let type;if(tMode==="income")type="income";else if(tMode==="expense")type="expense";else{const n=parseFloat((raw).replace(/[^0-9.,-]/g,"").replace(",","."));type=(n<0||(r[CH]||"").toLowerCase().includes("gasto"))?"expense":"income";}
      const accountId=aMap[r[CC]]||S.accounts[0]?.id||"";const cid=cMap[r[CB]]||"";
      const isSub=S.subcategories?.some(x=>x.id===cid);const sub=isSub?S.subcategories.find(x=>x.id===cid):null;
      txs.push({id:uid(),date:pDate(r[CA]),type,accountId,categoryId:isSub?(sub?.catId||""):(cid||S.categories[0]?.id||""),subcategoryId:isSub?cid:"",amount,note:r[CG]||r[CH]||""});count++;
    });
    upd(s=>{s.transactions=[...s.transactions,...txs];});setStatus({count,skip});setPrev(null);if(ref.current)ref.current.value="";
  };
  const accNms=prev?[...new Set(prev.allRows.map(r=>r[CC]).filter(Boolean))]:[];
  const catNms=prev?[...new Set(prev.allRows.map(r=>r[CB]).filter(Boolean))]:[];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={st.card}>
        <div style={{fontWeight:500,marginBottom:4}}>Importar desde Gestor de gastos</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Exporta tu historial como CSV y cárgalo aquí.</div>
        <input ref={ref} type="file" accept=".csv,.txt" onChange={handleFile} style={{fontSize:13}}/>
        {err&&<div style={{color:C.red,fontSize:13,marginTop:10}}>{err}</div>}
        {status&&<div style={{marginTop:12,padding:"10px 14px",background:"#f2faf5",borderRadius:6}}><div style={{color:C.green,fontWeight:500,fontSize:13}}>✓ {status.count} transacciones importadas</div>{status.skip>0&&<div style={{color:C.muted,fontSize:12,marginTop:2}}>{status.skip} filas omitidas</div>}</div>}
      </div>
      {prev&&(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={st.card}>
            <div style={{fontWeight:500,marginBottom:10,fontSize:13}}>Vista previa</div>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",fontSize:11,borderCollapse:"collapse",whiteSpace:"nowrap"}}><thead><tr>{prev.headers.map(h=><th key={h} style={{textAlign:"left",padding:"5px 8px",borderBottom:"1px solid #e8e6e1",color:C.muted,fontWeight:400}}>{h}</th>)}</tr></thead><tbody>{prev.previewRows.map((r,i)=><tr key={i}>{prev.headers.map(h=><td key={h} style={{padding:"5px 8px",borderBottom:"1px solid #e8e6e1",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis"}}>{r[h]}</td>)}</tr>)}</tbody></table></div>
          </div>
          <div style={st.card}>
            <div style={{fontWeight:500,marginBottom:12,fontSize:13}}>Tipo de transacción</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[["auto","Automático"],["income","Todo ingreso"],["expense","Todo egreso"]].map(([v,l])=>(
                <button key={v} onClick={()=>setTMode(v)} style={{...st.btn,fontWeight:tMode===v?500:400,background:tMode===v?"#1a1a1a":"none",color:tMode===v?"#fff":"#1a1a1a"}}>{l}</button>
              ))}
            </div>
          </div>
          {accNms.length>0&&<div style={st.card}><div style={{fontWeight:500,marginBottom:4,fontSize:13}}>Cuentas</div><div style={{fontSize:12,color:C.muted,marginBottom:12}}>Asocia cada cuenta del CSV.</div>{accNms.map(name=><div key={name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><span style={{flex:1,fontSize:13}}>{name}</span><span style={{color:C.muted}}>→</span><select value={aMap[name]||""} onChange={e=>setAMap(m=>({...m,[name]:e.target.value}))} style={{...st.select,width:180}}><option value="">— Omitir —</option>{S.accounts.filter(a=>!a.archived).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div>)}</div>}
          {catNms.length>0&&<div style={st.card}><div style={{fontWeight:500,marginBottom:4,fontSize:13}}>Categorías</div><div style={{fontSize:12,color:C.muted,marginBottom:12}}>Asocia cada categoría del CSV.</div>{catNms.map(name=><div key={name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><span style={{flex:1,fontSize:13}}>{name}</span><span style={{color:C.muted}}>→</span><select value={cMap[name]||""} onChange={e=>setCMap(m=>({...m,[name]:e.target.value}))} style={{...st.select,width:180}}><option value="">— Sin categoría —</option><optgroup label="Categorías">{S.categories.filter(c=>!c.archived).map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</optgroup><optgroup label="Ítems">{(S.subcategories||[]).filter(x=>!x.archived).map(x=>{const cat=S.categories.find(c=>c.id===x.catId);return<option key={x.id} value={x.id}>{x.icon} {x.name} ({cat?.name})</option>;})}</optgroup></select></div>)}</div>}
          <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
            <button onClick={()=>{setPrev(null);if(ref.current)ref.current.value="";}} style={st.btn}>Cancelar</button>
            <button onClick={doImport} style={st.btnPri}>Importar {prev.allRows.length} registros</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── AJUSTES ─────────────────────────────────────────────────────────────────
function Ajustes({S,upd}){
  const [confirm,setConfirm]=useState(false);
  const exportData=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="finanzas_backup.json";a.click();
  };
  const importRef=useRef();
  const importData=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);upd(s=>{Object.assign(s,d);});}catch{alert("Archivo inválido.");}};
    r.readAsText(f);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={st.card}>
        <div style={{fontWeight:500,marginBottom:4}}>Copia de seguridad</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Exporta todos tus datos en formato JSON para guardar o transferir a otro dispositivo.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={exportData} style={st.btnPri}>⬇ Exportar datos</button>
          <div>
            <input ref={importRef} type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
            <button onClick={()=>importRef.current.click()} style={st.btn}>⬆ Importar backup</button>
          </div>
        </div>
      </div>
      <div style={st.card}>
        <div style={{fontWeight:500,marginBottom:4,color:C.red}}>Zona de peligro</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Elimina todas las transacciones, cuentas, categorías y presupuestos. Esta acción no se puede deshacer.</div>
        {!confirm
          ?<button onClick={()=>setConfirm(true)} style={{...st.btn,color:C.red,border:`1px solid ${C.red}44`}}>🗑 Borrar todos los datos</button>
          :<div style={{display:"flex",gap:8,alignItems:"center",background:"#fdf2f2",border:`1px solid ${C.red}33`,borderRadius:6,padding:"10px 14px"}}>
            <span style={{fontSize:13,color:C.red,flex:1}}>¿Seguro? Esto borrará todo.</span>
            <button onClick={()=>{upd(s=>{s.transactions=[];s.transfers=[];s.budgets=[];});setConfirm(false);}} style={{border:"none",background:C.red,color:"#fff",borderRadius:5,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:500}}>Sí, borrar</button>
            <button onClick={()=>setConfirm(false)} style={{...st.btn,fontSize:12}}>Cancelar</button>
          </div>
        }
      </div>
      <div style={st.card}>
        <div style={{fontWeight:500,marginBottom:12}}>Acerca de</div>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.7}}>
          <div>App de Finanzas Personales</div>
          <div>Versión 1.0 · Multi-divisa</div>
          <div style={{marginTop:8}}>Divisas: BOB · USD · USDT · BTC</div>
          <div>Datos guardados localmente en tu dispositivo.</div>
        </div>
      </div>
    </div>
  );
}

const FT=({children})=><div style={{fontWeight:500,fontSize:15,marginBottom:20}}>{children}</div>;
const FF=({label,children})=><div><label style={st.label}>{label}</label>{children}</div>;
const FA=({close,onSave,label="Guardar"})=>(<div style={{display:"flex",gap:8,marginTop:24}}><button onClick={close} style={{...st.btn,flex:1}}>Cancelar</button><button onClick={onSave} style={{...st.btnPri,flex:1}}>{label}</button></div>);

function AccountForm({S,upd,close,account}){
  const [form,setForm]=useState(account||{name:"",color:COLORS[0],icon:"🏦",currencyId:"BOB",excludeBalance:false});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.name)return;upd(s=>{if(account){const a=s.accounts.find(x=>x.id===account.id);Object.assign(a,form);}else s.accounts.push({...form,id:uid(),archived:false});});close();};
  return(
    <div><FT>{account?"Editar":"Nueva"} cuenta</FT>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <FF label="Nombre"><input value={form.name} onChange={e=>f("name")(e.target.value)} placeholder="Nombre" style={st.input}/></FF>
        <FF label="Divisa"><select value={form.currencyId} onChange={e=>f("currencyId")(e.target.value)} style={st.select}>{S.currencies.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name} ({c.code})</option>)}</select></FF>
        <FF label="Ícono"><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>{ICONS.map(ic=><button key={ic} onClick={()=>f("icon")(ic)} style={{width:30,height:30,border:form.icon===ic?"2px solid #1a1a1a":"1px solid #e8e6e1",borderRadius:5,background:"none",cursor:"pointer",fontSize:15}}>{ic}</button>)}</div></FF>
        <FF label="Color"><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>{COLORS.map(c=><button key={c} onClick={()=>f("color")(c)} style={{width:24,height:24,borderRadius:"50%",background:c,border:form.color===c?"3px solid #1a1a1a":"2px solid transparent",cursor:"pointer"}}/>)}</div></FF>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}}><input type="checkbox" checked={form.excludeBalance} onChange={e=>f("excludeBalance")(e.target.checked)}/> No incluir en balance total</label>
      </div>
      <FA close={close} onSave={save}/>
    </div>
  );
}

function CategoryForm({S,upd,close,category}){
  const [form,setForm]=useState(category||{name:"",type:"expense",color:COLORS[0],icon:"🏷️"});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.name)return;upd(s=>{if(category){const c=s.categories.find(x=>x.id===category.id);Object.assign(c,form);}else s.categories.push({...form,id:uid(),archived:false});});close();};
  return(
    <div><FT>{category?"Editar":"Nueva"} categoría</FT>
      <div style={{display:"flex",gap:6,marginBottom:18}}>{["income","expense"].map(t=><button key={t} onClick={()=>f("type")(t)} style={{...st.btn,flex:1,fontWeight:form.type===t?500:400,background:form.type===t?"#1a1a1a":"none",color:form.type===t?"#fff":"#1a1a1a"}}>{t==="income"?"Ingreso":"Egreso"}</button>)}</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <FF label="Nombre"><input value={form.name} onChange={e=>f("name")(e.target.value)} placeholder="Nombre" style={st.input}/></FF>
        <FF label="Ícono"><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>{ICONS.map(ic=><button key={ic} onClick={()=>f("icon")(ic)} style={{width:30,height:30,border:form.icon===ic?"2px solid #1a1a1a":"1px solid #e8e6e1",borderRadius:5,background:"none",cursor:"pointer",fontSize:15}}>{ic}</button>)}</div></FF>
        <FF label="Color"><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>{COLORS.map(c=><button key={c} onClick={()=>f("color")(c)} style={{width:24,height:24,borderRadius:"50%",background:c,border:form.color===c?"3px solid #1a1a1a":"2px solid transparent",cursor:"pointer"}}/>)}</div></FF>
      </div>
      <FA close={close} onSave={save}/>
    </div>
  );
}

function BudgetForm({S,upd,close}){
  const [form,setForm]=useState({categoryId:"",period:"monthly",amount:"",currencyId:"BOB"});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.categoryId||!form.amount)return;upd(s=>{s.budgets.push({...form,id:uid(),amount:parseFloat(form.amount)});});close();};
  return(
    <div><FT>Nuevo presupuesto</FT>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <FF label="Categoría"><select value={form.categoryId} onChange={e=>f("categoryId")(e.target.value)} style={st.select}><option value="">— Seleccionar —</option>{S.categories.filter(c=>!c.archived&&c.type==="expense").map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></FF>
        <FF label="Período"><select value={form.period} onChange={e=>f("period")(e.target.value)} style={st.select}><option value="monthly">Mensual</option><option value="annual">Anual</option></select></FF>
        <FF label="Divisa"><select value={form.currencyId} onChange={e=>f("currencyId")(e.target.value)} style={st.select}>{S.currencies.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name} ({c.code})</option>)}</select></FF>
        <FF label="Monto límite"><input type="number" value={form.amount} onChange={e=>f("amount")(e.target.value)} placeholder="0.00" style={st.input}/></FF>
      </div>
      <FA close={close} onSave={save}/>
    </div>
  );
}

function TransferForm({S,upd,close}){
  const [form,setForm]=useState({fromId:"",toId:"",amount:"",date:today(),note:""});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.fromId||!form.toId||!form.amount||form.fromId===form.toId)return;upd(s=>{if(!s.transfers)s.transfers=[];s.transfers.push({...form,id:uid(),amount:parseFloat(form.amount)});});close();};
  const accs=S.accounts.filter(a=>!a.archived);
  return(
    <div><FT>Nueva transferencia</FT>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <FF label="Desde"><select value={form.fromId} onChange={e=>f("fromId")(e.target.value)} style={st.select}><option value="">—</option>{accs.map(a=>{const c=S.currencies.find(x=>x.id===a.currencyId);return<option key={a.id} value={a.id}>{a.name} ({c?.code})</option>;})}</select></FF>
        <FF label="Hacia"><select value={form.toId} onChange={e=>f("toId")(e.target.value)} style={st.select}><option value="">—</option>{accs.map(a=>{const c=S.currencies.find(x=>x.id===a.currencyId);return<option key={a.id} value={a.id}>{a.name} ({c?.code})</option>;})}</select></FF>
        <FF label="Monto"><input type="number" value={form.amount} onChange={e=>f("amount")(e.target.value)} placeholder="0.00" style={st.input}/></FF>
        <FF label="Fecha"><input type="date" value={form.date} onChange={e=>f("date")(e.target.value)} style={st.input}/></FF>
        <FF label="Nota"><input value={form.note} onChange={e=>f("note")(e.target.value)} placeholder="Opcional" style={st.input}/></FF>
      </div>
      <FA close={close} onSave={save} label="Transferir"/>
    </div>
  );
}

function CurrencyForm({S,upd,close}){
  const [form,setForm]=useState({code:"",name:"",symbol:"",type:"fiat",color:COLORS[0],icon:"💱"});
  const [rate,setRate]=useState("1");
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=()=>{if(!form.code||!form.name||!form.symbol)return;const n=parseFloat(rate)||1;upd(s=>{s.currencies.push({...form,id:form.code.toUpperCase(),code:form.code.toUpperCase(),rateToUSD:1/n});});close();};
  return(
    <div><FT>Nueva divisa</FT>
      <div style={{display:"flex",gap:6,marginBottom:18}}>{["fiat","crypto"].map(t=><button key={t} onClick={()=>f("type")(t)} style={{...st.btn,flex:1,fontWeight:form.type===t?500:400,background:form.type===t?"#1a1a1a":"none",color:form.type===t?"#fff":"#1a1a1a"}}>{t==="fiat"?"Fiat":"Cripto"}</button>)}</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <FF label="Código"><input value={form.code} onChange={e=>f("code")(e.target.value.toUpperCase())} placeholder="EUR" style={st.input} maxLength={10}/></FF>
          <FF label="Símbolo"><input value={form.symbol} onChange={e=>f("symbol")(e.target.value)} placeholder="€" style={st.input} maxLength={5}/></FF>
        </div>
        <FF label="Nombre"><input value={form.name} onChange={e=>f("name")(e.target.value)} placeholder="Euro" style={st.input}/></FF>
        <FF label={`1 USD = ? ${form.code||"divisa"}`}>
          <input type="number" value={rate} onChange={e=>setRate(e.target.value)} placeholder="6.96" style={st.input} step="any"/>
          <div style={{fontSize:11,color:C.muted,marginTop:4}}>Cuántas unidades equivalen a 1 dólar</div>
        </FF>
        <FF label="Color"><div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>{COLORS.map(c=><button key={c} onClick={()=>f("color")(c)} style={{width:24,height:24,borderRadius:"50%",background:c,border:form.color===c?"3px solid #1a1a1a":"2px solid transparent",cursor:"pointer"}}/>)}</div></FF>
      </div>
      <FA close={close} onSave={save} label="Agregar"/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
